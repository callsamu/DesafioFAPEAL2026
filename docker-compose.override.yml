services:
  db:
    ports:
      - "5433:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data

  backend:
    build:
      target: development
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      target: development
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
